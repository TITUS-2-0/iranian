text:
- body:
  - pb: 26
  - p:
    - lb: 1
  - chapter[n=1]:
    - paragraph[n=0]:
      - p:
        - PWN ŠM Y yẕd՚n W dhšn Y nywk! YHWN՚t ZK Y ŠPYL, tn' drwstyh W dgl zywšnyh
          W
        - lb[n=2]:
          - ՚p՚tCBWyh Y KRA ŠPYL՚n W pl՚lwn kwnšn՚n, n՚mcšt OLE, MNW l՚d Y̱ḴTYBWNyhyym!
          - pb: 27
        - lb: 1
    - paragraph[n=1]:
      - p:
        - cygwn MN ՚pst՚k pyt՚k PWN ywdtŠŠŠDY՚t gwpt YKOYMWNyt, AYK ZNE 7 p՚dk Y wn՚s
        - lb[n=2]:
          - PWN dyn' gwpt YKOYMWNyt, AYT Y plm՚n' W ՚glpt' W ՚wylyšt W ՚ldwš W hwl
            W b՚c՚y W y՚t W tn՚pwhl. ܀
          - pb: 28
        - lb: 1
    - paragraph[n=2]:
      - p:
        - flm՚n-I ALBA styl, W KRA styl-I ALBA ZWZN sng; ՚glpt W ՚wylyšt ZK Y
        - lb[n=2]: ksst' twb՚n', APš ՚lc Y PWN n՚mcšt, YHWWNt MNW wyšst ZWZN-I gwpt
            ՚ldwš
        - lb[n=3]: '{ddy} <styl> 30; hwl styl 60; b՚c՚y styl 90; W y՚t styl 100 W
            80 W tn՚pwhl tsyl 300.'
    - paragraph[n=3]:
      - p:
        - PWN {d՚tyh} <d՚t Y> pwlywtkyšyh, AYT MNW ptš ywtd՚tst՚n' YHWWNt HWEnd.
    - paragraph[n=3b]:
      - p:
        - ME, <gw>gwš<n>sp MN c՚štk Y ՚twr ՚whrmẕḏ, W swšyns MN c՚štk Y ՚twr plnb՚y
        - lb[n=2]: nrsyh, W mytwkm՚h MN c՚štk Y <gwgwšnsp>, W ՚plḵ MN c՚štk Y swšyns
        - lb[n=3]:
          - BRA gwpt;
          - pb: 29
        - lb: 1
    - paragraph[n=4]:
      - p:
        - W hm՚k pwlywtkyš՚n PWN ZNE 3 c՚štk YKOYMWNd; W ՚cš AYT Y swsttl, W AYT Y
        - lb[n=2]:
          - shttl YKOYMWNd.
          - pb: 30
        - lb: 1
  - chapter[n=2]:
    - paragraph[n=1]:
      - p:
        - ME, PWN stykl plglt Y ywdtŠŠŠDY՚t Y mytwkm՚h pyt՚k, AYK BYN ZK zm՚n AMT<š>
        - lb[n=2]: y՚n BRA OZLWNyt, AMTš KLB՚-I BYN LGLE bst YKOYMWNyt, AHLyc nswš
            MDM ḴN dwb՚lyt,
        - lb[n=3]: W AHL AMTš HẔYTWNt, ՚š nswš ḴN MHYTWNt. ܀
    - paragraph[n=2]:
      - p:
        - ZNE AYK, KLBA, MNW nswš MHYTWNyt, kt՚l? pswšhwl W wdšhwl W whwnzg W
        - lb[n=2]: "tlwk W lwkn'yk; W PWN lwkn'yk ywdt d՚tst՚n' YHWWNt HWEd: wn<n>d՚whrmzd"
        - lb[n=3]:
          - MN c՚štk Y ՚plg BRA gwpt, AYK LA MHYTWNyt.
          - pb: 31
        - lb: 1
    - paragraph[n=3]:
      - p:
        - KLBA nswš PWN ZK zm՚n MHYTWNyt, AMT gwšt HẔYTWNyt'; W AMT mwd ՚ywp n՚hwn
          HẔYTWNyt,
        - lb[n=2]:
          - LA MHYTWNyt.
          - pb: 32
        - lb: 1
    - paragraph[n=4]:
      - p:
        - KLBAyc Y kwl PWN ZK zm՚n MHYTWNyt, AMT pwck MDM ns՚y {MHYTWNyt} <HNHTWNyt>;
          W AMT MDM mwd
        - lb[n=2]: ՚ywp n՚hwn HNHTWNyt, LA MHYTWNyt.
    - paragraph[n=5]:
      - p:
        - "mwlw'k, MNW nswš MHYTWNyt, TLTA HWEd: s՚l Y gl, W wl՚ḵ Y syd՚, W klk՚s̱.\
          \ mwlwkyc"
        - lb[n=2]: PWN ZK zm՚n MHYTWNyt, AMTš s՚dk MDM LMYTWNyt
    - paragraph[n=5b]:
      - p:
        - BYN MYA W ՚p̄gynk W ՚dwynk AMTš HẔYTWNyt, LA MHYTWNyt.
        - pb: 33
        - lb: 1
    - paragraph[n=6]:
      - p:
        - NYŠE Y ՚pstn', wn<n>d՚whrmzd gwpt, AYK AMT PWN TLYN GBRA YḆLWNšn', KRA 2
          PWN
        - lb[n=2]: blšnwm BRA šwdšn'
    - paragraph[n=6b]:
      - p:
        - W ns՚y AMT BRA YḆLWNx2, sl{nbn} OL hz՚n ՚wlwn kwnšn'
    - paragraph[n=7]:
      - p:
        - W ptwyšk l՚d, 2 PWN ՚ywk b՚l LA YḆLWNšn' W 2 PWN ՚ywk {b՚l} mltwm LA š՚dt
        - lb[n=2]:
          - KLB՚-I W mltwm-I š՚dt
          - pb: 34
        - lb: 1
    - paragraph[n=8]:
      - p:
        - KRA MNW p՚hlyc Y ns՚y YDOYTWNyt š՚dt kwtk TLYN Y T'MNYA s՚lk, MNW p՚hlyc
          YDOYTWNyt,
        - lb[n=2]: š՚dt NYŠE 2 Y dšt՚n' ՚ywp 2 Y ns՚y [š՚dt] ՚ywp GBRA-I W NYŠE-I
            W
        - lb[n=3]:
          - ՚pwln'՚yk Y TWMNYA s՚lk š՚dt
          - pb: 35
        - lb: 1
    - paragraph[n=9]:
      - p:
        - hm՚k nhwptg, LA YḆLWNšn', ME ns՚y nk՚nyh.
    - paragraph[n=9b]:
      - p:
        - PWN w՚l՚n YḆLWNtn' mrglc՚nyk
    - paragraph[n=10]:
      - p:
        - AMT ՚bl h՚m<y>n' {?} YHWWNt YKOYMWNyt, MN BYTA BRA YḆLWNtn' ŠLYTA; W AMT
          PWN l՚s w՚l՚n
        - lb[n=2]: OHDWNyt, LAWHL OL h՚nk YHYTYWNtn' LA p՚txš՚ḏ, W AMT pyš d՚hlyc-I
            AYT, TME BRA HN՚y
        - lb[n=3]: HNHTWNyt; ZK, MNWš d՚hlyc NPŠE, AMTš bym, p՚txš՚ḏ, AMT BYN LA
        - lb[n=4]: ŠḆKWNyt; APš AHL BRA OL gyw՚k YḆLWNšn; W AMT MYA HNA nyzk b՚l՚d
            BYN YKOYMWNyt, AHLyc BRA
        - lb[n=5]:
          - HNHTWNyt, BRA LPMEyt
          - pb: 36
        - lb: 1
    - paragraph[n=11]:
      - p:
        - mytwkm՚h gwpt, AYK HWEt! wl-I hcpl Y ZK gyw՚k BRA ՚y ASLWNyt, ՚cyl hwšk
        - lb[n=2]: BRA ՚y OḆYDWNyt, W ns՚y ՚cyl Y ZK wl BRA ՚y HNHTWNyt', W wl YNSḆWN'ȳṯ,
            BRA LPMEyt. ܀
    - paragraph[n=12]:
      - p:
        - MN pncwm plglt Y ywdtŠŠŠDY՚t Y mytwkm՚h ՚ytwn' YMRRWNd, AYK ZK gyw՚k,
        - lb[n=2]: AYKš y՚n BRA OZLWN'yt, AMT MDM wstlg-I BRA YMYTWNyt, W mwd-I ՚ywp
            hnd՚m-I OL
        - lb[n=3]: b՚lyn' g՚s W zmyk YKOYMWNyt, h՚mbwn'c hmgwnk, lymn'yh zmyk OD OL
            MYA
        - lb[n=4]:
          - plwt YḆLWNyt
          - pb: 37
        - lb: 1
    - paragraph[n=13]:
      - p:
        - "W AMT MDM t՚ht', W p՚dk LWTE zmyk LA ՚ywkltk: AMTš mwd-I ՚ywp hnd՚m-I"
        - lb[n=2]: LAWHL OL tht YKOYMWNyt, plwt LA YḆLWNyt
    - paragraph[n=14]:
      - p:
        - AMT MDM zmyk Y gckrt BRA YMYTWNyt, gc lymn'; W AMT ZK gc BRA HP̱LWNd, W
          TWḆ
        - lb[n=2]: LAWHL lycynd, DKY՚
    - paragraph[n=15]:
      - p:
        - AMT MDM sng-I BRA YMYTWNyt, W sng LWTE zmyk ՚ywkltk, sng PWN ŠNT dlhn՚d
        - lb[n=2]: LWTE zmyk DKYA BRA YHWWNyt; W AMT ZK gyw՚k BRA HP̱LWNd, sng lymn',
            W BYN zm՚n
        - lb[n=3]:
          - ḴN šwdšn'.
          - pb: 38
        - lb: 1
    - paragraph[n=16]:
      - p:
        - AMT{š} sng LWTE zmyk AYT Y ՚ywkltk, W AYT Y ywdtkltk, W MDM BRA YMYTWNyt,
        - lb[n=2]: sng, ZK ՚nd gyw՚k cnd ns՚y MDM mt, lwmn'; AMTš BRA ŠḆKWNd, PWN
            ŠNT dlhn՚d
        - lb[n=3]: LWTE zmyk DKYA BRA YHWWNyt; W AMT BRA HP̱LWNd, sng hm՚k lymn',
            BYN zm՚n
        - lb[n=4]: ḴN šwdšn'; AMT sng LWTE zmyk LA OHDWNt YKOYMWNyt, W hcpl zmyk,
            sng hm՚k
        - lb[n=5]: lymn', BYN zm՚n ḴN šwdšn'.
    - paragraph[n=17]:
      - p:
        - "slgyn W ՚twrstl: AMTš <ns՚y W> NYŠE Y dšt՚n' hnd՚m MDM YHMTWNyt, KRA 2\
          \ lymn'. W u- nmk W gc Y PWN kltk <Y>, šwd ՚ytwn', cygwn sng."
    - paragraph[n=18]:
      - p:
        - "HT MDM b՚n-I BRA YMYTWNyt: AMTš hnd՚m-I ՚ywp mwd-I LAWHL OL kn՚l Y b՚n'\
          \ YKOYMWNyt,"
        - lb[n=2]:
          - b՚n' tn' ms՚y OD OL <twp, W zmyk OD OL> MYA lymn'; W hm՚k blsum
          - pb: 39
        - lb[n=1]: Y BYN ZK BYTA, <AMT> MN ZK gyw՚k, AYK lymn'yh plwt YḆLWNȳṯ, OD
            OL blswm 30 g՚m
        - lb[n=2]: Y TLTA p՚d AYT, {2} <՚> blswm LA lymn'; W AMTš mwd ՚ywp hnd՚m OL
            plk՚n'
        - lb[n=3]: LA mt YKOYMWNyt, b՚n' OD OL twhyk {?} lymn'
    - paragraph[n=19]:
      - p:
        - W AMT MDM lytn' {?} {lyt՚-I} BRA YMYTWNyt, tn' ms՚y OD OL MYA lymn'; <PWN>
          ŠNT dlhn՚d
        - lb[n=2]:
          - LWTE zmyk p՚k BRA YHWWNyt.
          - pb: 40
        - lb: 1
    - paragraph[n=20]:
      - p:
        - pwhl Y bstk ՚ytwn' YHWWNyt, cygwn b՚n'.
    - paragraph[n=21]:
      - p:
        - AMT MDM b՚n Y wlm-I BRA YMYTWNyt, ZKc ՚ytwn' YHWWNyt, cygwn b՚n'.
    - paragraph[n=22]:
      - p:
        - "AMT BYN wlm-I BRA YMYTWNyt: AMTš hnd՚m-I ՚ywp mwd-I OL plk՚n' LA YKOYMWNyt,"
        - lb[n=2]: lymn'yh plwt LA YḆLWNyt; W AMT{š} LAWHL YKOYMWNyt, plwt YḆLWNyt;
            p՚txš՚ḏ, AMT BRA HP̱LWNyt,
        - lb[n=2]: W TWḆc LAWHL lycyt, W DKYA.
    - paragraph[n=23]:
      - p:
        - "AMT PWN hpk՚-I {?}, W lsn' BYN glwk, BRA YMYTWNyt: AMTš BRA NPLWNstn' bym"
        - lb[n=2]: LOYT, plwt LA YḆLWNȳṯ; W AMTš BRA NPLWNstn bym, AMT{š} ZK bym
            MN kwst-I, PWN ZK
        - lb[n=3]:
          - kwst plwt YḆLWNȳṯ; W AMT BRA NPLWNst, ZK ՚nd <gyw՚k> plwt YḆLWNȳṯ, cnd
            NPLWNst.
          - pb: 41
        - lb: 1
    - paragraph[n=24]:
      - p:
        - "AMT, l՚st YTYBWNst <YKOYMWNyt> BRA YMYTWNyt: AMTš MN kwst-I NPLWNstn' bym,\
          \ <PWN> ZK kwst-I, W AMT MN KRA ALBA kwst bym, PWN KRA ALBA kwst plwt YḆLWNȳṯ;\
          \ W AMT BRA NPLWNst,"
        - lb[n=3]: ZK ՚nd gyw՚k cnd NPLWNst, plwt YḆLWNȳṯ.
    - paragraph[n=25]:
      - p:
        - "W AMT MDM dlht-I BRA YMYTWNyt: AMTš pwst tlwn, W MN BRA NPLWNstn' bym LOYT,\
          \ plwt"
        - lb[n=2]: LA YḆLWNȳṯ; W AMTš bym, tn' ms՚y plwt YBLWNȳṯ.
    - paragraph[n=26]:
      - p:
        - 'W AMT dlht pwst hwšk: AMTš bym W AMTš LA bym, plwt YBLWNȳṯ.'
    - paragraph[n=27]:
      - p:
        - 'AMT MDM t՚k-I <Y> dlht BRA YMYTWNyt, Y tlwn: AMTš MN BRA NPLWNst bym LOYT,
          plwt LA YBLWNȳṯ.'
        - pb: 42
        - lb: 1
    - paragraph[n=28]:
      - p:
        - "W AMTš bym, ՚ywp t՚k-I <Y> dlht Y hwšk: AMTš h՚mbwnc mwd-I ՚ywp hnd՚m-I\
          \ LAWHL OL dlht Y m՚tkwl YKOYMWNyt, tn' ms՚y plwt YḆLWNȳṯ."
    - paragraph[n=29]:
      - p:
        - "W AMTš LAWHL OL dlht Y m՚tkwl LA YKOYMWNyt: BRA AMTš MN BRA NPLWNstn' bym,\
          \ OD plwt LA YḆLWNȳṯ."
    - paragraph[n=30]:
      - p:
        - AMT{š} ns՚y-I MN bylwn PWN hwmb'-I LAWHL YKOYMWNyt, MNWš HS BYN, ՚ hwmb'
        - lb[n=2]: lymn', HS DKYA.
    - paragraph[n=31]:
      - p:
        - W AMT ՚ndlwn, BYN hwmb', BYN HS BRA YMYTWNyt, HTš hmbwnc
        - lb[n=2]: mwd-I ՚ywp klck-I PWN LAWHL LA YKOYMWNyt, HS lymn' W hwmb' LA lymn'.
    - paragraph[n=32]:
      - p:
        - AMT hwmb', Y MHŠYA BYN, APš MN bylwn ns՚y ptš LAWHL YKOYMWNyt, HNAc, AMTš
        - lb[n=2]:
          - '՚ndlwn YKOYMWNyt HNA l՚d: ME MHŠYA bylwn YATWNyt W LAWHL OL ՚ndlwn OZLWNyt,'
          - pb: 43
        - lb[n=1]: KRA 2 lymn', hwmb' W MHŠYA; W hmbwnc PWN hwškl MNDOM BYN krtn'
        - lb[n=2]: LA š՚dt.
    - paragraph[n=33]:
      - p:
        - AMT glck-I BYN hwmb'-I, MNW HS BYN, KRA TLYN ՚k՚l W lymn, ME
        - lb[n=2]: ptwyšk OḆYDWNyt;
    - paragraph[n=34]:
      - p:
        - W AMT{š} ywlt՚k BYN, ՚ hwmb' lymn' W ywlt՚k p՚k; W AMT ՚ndlwn Y hwmb',
        - lb[n=2]: <AMT> hmbwnc LAWHL OL hwmb' LA YKOYMWNyt, ywlt՚k ZK ՚nd gyw՚k cnd
            glck mt,
        - lb[n=3]: W m՚lšn' Y glck MDM OZLWNt YKOYMWNyt, ՚y! m՚lšn' Y glck šwsl AYT
            ZK <Y> YMYTWNšn,
        - lb[n=4]:
          - BRA YNSḆWNšn W BRA LMYTWNšn.
          - pb: 44
        - lb: 1
    - paragraph[n=35]:
      - p:
        - W AMT mwd ՚ywp ns՚y, h՚mbwnc, LAWHL OL hwmb' YKOYMWNyt, hwmb' lymn', BRA
          PWN
        - lb[n=2]: hwškl š՚dt.
    - paragraph[n=36]:
      - p:
        - hšt W APLA W c՚lwk PWN MNDOM Y NPŠE ywdtkltk, W LWTE zmyk ՚ywkltk;
        - lb[n=2]: PWN MNDOM Y NPŠE ywdtkltk YHWWNtn' HNA, AYK ZK ՚nd gyw՚k cnd ns՚y
            MDM YHMTWNyt lymn';
        - lb[n=3]: <W> LWTE zmyk ՚ywkltk YHWWNtn' HNA, AYK lymn'yh OD OL MYA plwt
            YḆLWNȳṯ.
    - paragraph[n=37]:
      - p:
        - slgn W ՚twrstl W KHM՚' {?} W ՚p՚r̄yk MNDOM Y ՚ltk PWN MNDOM Y NPŠE ՚ywkltk,
          W
        - lb[n=2]: LWTE zmyk ywdtkltk; PWN MNDOM Y NPŠE ՚ywkltk YHWWNtn' HNA, AYKš,
            AMTš ns՚y
        - lb[n=3]:
          - MDM YHMTWNyt, hm՚k lymn'; W LWTE zmyk ywdtkltk YHWWNtn' HNA, AYK AMTš
            ns՚y MDM YHMTWNyt, zmyk lymn' LA OHDWNyt.
          - pb: 45
        - lb: 1
    - paragraph[n=38]:
      - p:
        - W <BYN> h՚nk-I {MNW} <AMT> ycšn s՚ht YKOYMWNyt, APš KLBA ՚ywp mltwm BYN
          BRA
        - lb[n=2]: wtylyt, nhwst k՚l ZNE kwnšn', AYK ՚thš MN ՚n՚kyh BRA bwhtšn'; HTc
            ՚thš
        - lb[n=3]: ՚ytwn' BRA twb՚n' bwltn', AYK PWN 3 g՚m Y ns՚y BRA YḆLWNȳṯ, AHLyc
            BRA YḆLWNšn'; W
        - lb[n=4]: dyw՚l LA bwlšn;
    - paragraph[n=39]:
      - p:
        - lwšn gwpt, ՚y! glyn ḴN PSKWNšn', W gcyn' LA PSKWNšn'; W hcdl W hcpl PWN
        - lb[n=2]:
          - bwtwzytyh Y dyw՚l LA ՚m՚l.
          - pb: 46
        - lb: 1
    - paragraph[n=40]:
      - p:
        - ՚thš BYN 3 g՚m Y ns՚y YBLWNtn tn՚pwhl-I wn՚s, W AMT typšn OL ns՚y
        - lb[n=2]: YHMTWNyt, mlglc՚n'.
    - paragraph[n=41]:
      - p:
        - hwlšn Y s՚htk BYN ZK h՚nk hm՚k ՚k՚l; W ZK Y LA s՚htk, 9 šp <W> BYRH
        - lb[n=2]: dlhn՚d BYN ՚p՚yt.
    - paragraph[n=42]:
      - p:
        - wstlkc, hmgwnk, BRA ZK Y PWN tn' YHSNNyt; ZKc {Y} BYN ZK zm՚n LA DKYA,
        - lb[n=2]: ME BYN k՚l YKOYMWNyt.
    - paragraph[n=43]:
      - p:
        - W zwhlyc, Y YNSḆWNt YKOYMWNyt W ZK gyw՚k YKOYMWNyt, zm՚nyk BRA OL MYA YḆLWNšn;
          yywc
        - foreign[lg=pal-Latn-x-trl]: jum
        - lb[n=2]:
          - hmgwnk.
          - pb: 47
        - lb: 1
    - paragraph[n=44]:
      - p:
        - yšt y՚mk, wn<n>d՚whrmzd gwpt, AYK TŠ՚<š> špk <W> BYRH dlhn՚d BYN ՚p՚yt;
        - lb[n=2]: dpyr gwpt, AYK HWEt! AMT YDE šwd OḆYDWNd W BRA šwdynd, BYN zm՚n
            DKYA BRA YHWWNt.
    - paragraph[n=45]:
      - p:
        - "HT BYN h՚nk-I AYT ՚y gncynk-I, W BYN dlg՚s BRA YMYTWNyt: HT ՚ytwn',"
        - lb[n=2]: AYK BBA pr՚c OḆYDWNȳṯ, W ns՚y OL ZNE kwstk YATWNyt, twhyk Y ZNE
            kwstk lymn'; W HT
        - lb[n=3]: ns՚y OL ZK kwstk YATWNyt, twhyk Y ZK kwstk lymn'; AMT OL KRA 2
            kwstk YATWNyt, ՚yw՚c
        - lb[n=4]:
          - twhyk Y dlg՚s tn'yh՚ lymn', h՚nk KRA 2 DKYA.
          - pb: 48
        - lb: 1
    - paragraph[n=46]:
      - p:
        - W gwmbt Y ՚thš՚n Y w՚hl՚m, twhyk lymn' LA YHWWNt.
    - paragraph[n=47]:
      - p:
        - HT PWN wškl BRA YMYTWNyt, hwlšn Y s՚htk, Y BYN 3 g՚m, hm՚k ՚k՚l, W BRA
        - lb[n=2]:
          - MN ALBA g՚m LA lymn'.
          - pb: 49
        - lb: 1
    - paragraph[n=48]:
      - p:
        - hwlšn Y s՚htk ZNE, cygwn LHM՚' {?}, W gwšt Y pwhtk W brštk, W hwltyk Y kltk.
    - paragraph[n=49]:
      - p:
        - W wl Y ՚thš Y w՚hl՚m PWN ptm՚nk lymn' ḴN YHWWNt.
        - pb: 50
        - lb: 1
    - paragraph[n=50]:
      - p:
        - ՚thš, Y PWN ZK h՚nk BYN YḆLWNȳṯ, MNW TYŠŠ(!) špk W BYRH dlhn՚d PWN p՚k
          bwtn'
        - lb[n=2]: "BYN ՚p՚yt: PWN BYN YḆLWNtn', tn՚pwhl-I wn՚s; W PWN ՚plwhtn', tn՚pwhl-I"
        - lb[n=3]: <wn՚s>; W <PWN> KRA hwl, Y BRA YMYTWNyt BRA KTLWNyt, tn՚pwhl-I
            wn՚s.
    - paragraph[n=51]:
      - p:
        - "MYAc: PWN BYN bwltn' plm՚n-I wn՚s; W PWN ZK gyw՚k, AYKš HYA BRA OZLWNt,\
          \ MYA"
        - lb[n=2]: lyhtn' tn՚pwhl-I wn՚s; W PWN ywdt gyw՚k lyhtn' y՚t՚y wn՚s.
